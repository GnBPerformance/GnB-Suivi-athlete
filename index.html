<style>
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --line:#E1E3DC; --ink:#15181D; --muted:#5B616B;
  --accent:#2346C8; --on-accent:#FFFFFF; --link:#2346C8;
  --block:#15181D; --on-block:#FFFFFF; --on-block-muted:#C4C8CF; --seg:#E4E6E0; --bar-past:#B9C0CC;
  --ok-bg:#E4EAFB; --ok-fg:#1D3AA8; --warn-bg:#FBE4CF; --warn-fg:#7E3F0E;
  --alert-bg:#A3341A; --alert-fg:#FFFFFF; --na-bg:#ECEDE9; --na-fg:#4A5059;
  --hl:#9CB0FF;
  --ph-ech-c:#C2620F; --ph-ech-bg:#FDF2E6; --ph-corps-c:#2346C8; --ph-corps-bg:#F1F4FD; --ph-calme-c:#2E7D5B; --ph-calme-bg:#EBF6F0;
  --display:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --body:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* ---------- thème « Galaxie » (test) : fond noir, détails violet profond tirant sur le bleu */
:root[data-theme="galaxie"]{
  color-scheme:dark;
  --bg:#06050B; --surface:#110E1C; --line:#2A2442; --ink:#EEEBF8; --muted:#A6A0BF;
  --accent:#5B3BE6; --on-accent:#FFFFFF; --link:#B3A4FF;
  --block:#171230; --on-block:#FFFFFF; --on-block-muted:#B8B0D6; --seg:#1A1529; --bar-past:#3D3560;
  --ok-bg:#221A4A; --ok-fg:#C9BEFF; --warn-bg:#3D2410; --warn-fg:#FFC99A;
  --alert-bg:#C0392B; --alert-fg:#FFFFFF; --na-bg:#1C1828; --na-fg:#BDB7D3;
  --hl:#B9A8FF;
  --ph-ech-c:#C9651A; --ph-ech-bg:rgba(201,101,26,.10); --ph-corps-c:#6A4BF0; --ph-corps-bg:rgba(106,75,240,.11); --ph-calme-c:#2E8F64; --ph-calme-bg:rgba(46,143,100,.11);
  --grad:linear-gradient(135deg,#3B1FA8 0%,#5B3BE6 55%,#2F45D0 100%);
  --grad-block:linear-gradient(160deg,#1E1640 0%,#110D22 100%);
  --glow:0 6px 24px rgba(91,59,230,.35);
}
[data-theme="galaxie"] body{background:
  radial-gradient(900px 520px at 85% -8%, rgba(91,59,230,.30), transparent 62%),
  radial-gradient(760px 480px at -12% 38%, rgba(47,69,208,.18), transparent 60%),
  radial-gradient(700px 420px at 60% 110%, rgba(110,40,200,.16), transparent 60%),
  #06050B; background-attachment:fixed}
[data-theme="galaxie"] body::before{content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.55;
  background-image:
    radial-gradient(1px 1px at 12% 18%, #fff, transparent 60%), radial-gradient(1px 1px at 72% 9%, #d9d0ff, transparent 60%),
    radial-gradient(1.5px 1.5px at 38% 42%, #fff, transparent 60%), radial-gradient(1px 1px at 88% 36%, #cfc4ff, transparent 60%),
    radial-gradient(1px 1px at 22% 74%, #fff, transparent 60%), radial-gradient(1.5px 1.5px at 64% 66%, #e3dcff, transparent 60%),
    radial-gradient(1px 1px at 92% 82%, #fff, transparent 60%), radial-gradient(1px 1px at 50% 92%, #d9d0ff, transparent 60%);
  background-size:420px 520px}
[data-theme="galaxie"] #app{position:relative; z-index:1}
[data-theme="galaxie"] .card{background:rgba(17,14,28,.88)}
[data-theme="galaxie"] .card.accent,[data-theme="galaxie"] .btn.primary,[data-theme="galaxie"] .avatar.blue{background:var(--grad)}
[data-theme="galaxie"] .card.accent,[data-theme="galaxie"] .btn.primary{box-shadow:var(--glow)}
[data-theme="galaxie"] .card.block,[data-theme="galaxie"] .coachhead{background:var(--grad-block); border:1px solid rgba(150,120,255,.20)}
[data-theme="galaxie"] .btn.dark{background:var(--grad-block); border:1px solid rgba(150,120,255,.28)}
[data-theme="galaxie"] .btn.light{background:#FFFFFF; color:#1A1340}
[data-theme="galaxie"] .blue-t,[data-theme="galaxie"] th,[data-theme="galaxie"] .prog-ex .dose{color:var(--link)}
[data-theme="galaxie"] .btn.ghost.blue{border-color:var(--link); color:var(--link)}
[data-theme="galaxie"] .bar{background:linear-gradient(180deg,#8E72FF,#4B32D6)}
[data-theme="galaxie"] .bar.past{background:var(--bar-past)}
[data-theme="galaxie"] .bar.empty{background:var(--line)}
[data-theme="galaxie"] .num[aria-pressed="true"],[data-theme="galaxie"] .chip[aria-pressed="true"],[data-theme="galaxie"] .mode button[aria-pressed="true"]{background:var(--grad); border-color:transparent; box-shadow:0 4px 14px rgba(91,59,230,.35)}
[data-theme="galaxie"] .seg button[aria-pressed="true"]{background:#2C2258; color:#FFFFFF; box-shadow:inset 0 0 0 1px rgba(179,164,255,.35)}
[data-theme="galaxie"] nav.tabs{background:rgba(9,7,16,.86); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border-top-color:rgba(150,120,255,.18)}
[data-theme="galaxie"] nav.tabs button[aria-current="page"]{color:var(--link); text-shadow:0 0 12px rgba(179,164,255,.55)}
[data-theme="galaxie"] .prog-ex .ph{background:#0D0B16}
[data-theme="galaxie"] .prog-bloc .prog-ex{border-top-color:rgba(255,255,255,.08)}
[data-theme="galaxie"] .zoom{background:rgba(5,4,10,.94)}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.45; min-height:100%}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h1,h2,h3{font-family:var(--display); margin:0; letter-spacing:-0.3px}
a{color:var(--link)}
.wrap{max-width:480px; margin:0 auto; padding:24px 20px 110px}
.wrap.wide{max-width:1080px; padding-bottom:48px}
.row{display:flex; align-items:center; gap:12px}
.between{justify-content:space-between}
.stack{display:flex; flex-direction:column; gap:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px}
.card.accent{background:var(--accent); color:var(--on-accent); border:none}
.card.block{background:var(--block); color:var(--on-block); border:none}
.card.block .muted{color:var(--on-block-muted)}
.big{font-family:var(--display); font-weight:800; font-size:34px; line-height:1}
h1.title{font-weight:800; font-size:28px; letter-spacing:-0.5px}
.avatar{width:44px; height:44px; border-radius:22px; background:var(--block); color:var(--on-block); display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:700}
.btn{height:50px; border:none; border-radius:14px; padding:0 18px; font-weight:600; font-size:15px; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none}
.btn.primary{background:var(--accent); color:var(--on-accent)}
.btn.dark{background:var(--block); color:var(--on-block)}
.btn.light{background:#FFFFFF; color:#15181D}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--ink); height:44px}
.btn.full{width:100%}
.btn:disabled{opacity:.5; cursor:not-allowed}
.pill{display:inline-block; font-size:12px; font-weight:600; padding:4px 10px; border-radius:99px; white-space:nowrap}
.s-ok{background:var(--ok-bg); color:var(--ok-fg)}
.s-warn{background:var(--warn-bg); color:var(--warn-fg)}
.s-alert{background:var(--alert-bg); color:var(--alert-fg)}
.s-na{background:var(--na-bg); color:var(--na-fg)}
.bars{display:flex; align-items:flex-end; gap:8px}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0}
.bar{width:100%; border-radius:6px; background:var(--accent); min-height:4px}
.bar.empty{background:var(--line)}
.bar.past{background:var(--bar-past)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{height:42px; padding:0 14px; border-radius:99px; border:1px solid var(--line); background:var(--surface); font-size:14px}
.chip[aria-pressed="true"]{background:var(--block); color:var(--on-block); border-color:var(--block)}
.grid-rpe{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:6px}
.grid-5{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px}
.num{height:46px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-family:var(--display); font-weight:700; font-size:16px}
.num[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
label.lab{font-size:13px; font-weight:600; color:var(--muted); display:block; margin-bottom:6px}
.field{height:48px; width:100%; border-radius:12px; border:1px solid var(--line); background:var(--surface); padding:0 14px; font-size:15px}
textarea.field{height:74px; padding:12px 14px; resize:none}
.two{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.seg{background:var(--seg); border-radius:12px; padding:4px; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:4px}
.seg button{height:38px; border:none; border-radius:9px; background:transparent; color:var(--muted); font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); font-weight:600}
nav.tabs{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); z-index:5}
nav.tabs .in{max-width:480px; margin:0 auto; display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); height:68px}
nav.tabs button{border:none; background:none; color:var(--muted); font-size:11px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px}
nav.tabs button[aria-current="page"]{color:var(--link); font-weight:600}
.list{display:flex; flex-direction:column; gap:10px}
.item{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px}
.coachhead{background:var(--block); color:var(--on-block); border-radius:22px; padding:22px}
.kpis{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:16px}
.kpi{background:rgba(255,255,255,.08); border-radius:12px; padding:12px}
.kpi b{font-family:var(--display); font-size:22px; display:block}
.tablebox{overflow-x:auto; border:1px solid var(--line); border-radius:16px; background:var(--surface)}
table{border-collapse:collapse; width:100%; min-width:760px; font-size:14px}
th{font-size:12px; color:var(--muted); font-weight:600; text-align:left; padding:12px 14px; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
td.n{font-variant-numeric:tabular-nums; text-align:right}
.toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:var(--block); color:var(--on-block); padding:12px 18px; border-radius:12px; font-size:14px; z-index:10; max-width:90vw}
.notice{border-radius:14px; padding:14px 16px; font-size:14px; background:var(--warn-bg); color:var(--warn-fg)}
.sect{margin-top:28px}
.sect h2{font-size:19px; margin-bottom:12px}
.mode{display:inline-flex; background:var(--seg); border-radius:12px; padding:4px; gap:4px}
.mode button{border:none; background:transparent; height:36px; padding:0 14px; border-radius:9px; font-size:14px; color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--surface); color:var(--ink); font-weight:600}
.legend{display:flex; gap:16px; font-size:12px; color:var(--muted); flex-wrap:wrap}
.dot{width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:6px; vertical-align:-1px}


.blue-t{color:var(--accent)}
.avatar.blue{background:var(--accent); color:#fff}
.btn.ghost.blue{border-color:var(--accent); color:var(--accent)}
.mode button[aria-pressed="true"]{background:var(--accent); color:#fff}
.kpi b{color:var(--hl)}
tr.click:hover td,tr.click.on td{background:var(--ok-bg)}
th{color:var(--accent)}
.sect h2{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}

.prog-ex{border-top:1px solid var(--line); padding:12px 0; display:flex; flex-direction:column; gap:4px}
.prog-ex:first-of-type{border-top:none}
.prog-ex .nm{font-weight:600; font-size:15px}
.prog-ex .dose{font-size:14px; color:var(--accent); font-weight:600}
.prog-ex .cons{font-size:13px; color:var(--muted); line-height:1.4}
.prog-ex .ph{display:block; width:100%; height:220px; object-fit:contain; background:#F2F3EF; border:1px solid var(--line); border-radius:12px; margin:4px 0; cursor:zoom-in}
.zoom{position:fixed; inset:0; background:rgba(21,24,29,.92); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; cursor:zoom-out}
.zoom img{max-width:100%; max-height:100%; border-radius:10px; background:#fff}
.prog-ex a{font-size:13px; font-weight:600}
.prog-bloc{margin-top:12px; border-radius:12px; border-left:5px solid var(--ph-c); background:var(--ph-bg); padding:10px 12px 4px}
.prog-bloc:first-child{margin-top:10px}
.prog-bloc .bloc-h{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:2px}
.prog-bloc .phase-chip{font-size:11px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:#fff; background:var(--ph-c); padding:3px 9px; border-radius:99px}
.prog-bloc h4{margin:0; font-family:var(--display); font-size:15px; flex:1 1 auto}
.prog-bloc .prog-ex{border-top-color:rgba(21,24,29,.10)}
.prog-bloc.ph-ech{--ph-c:var(--ph-ech-c); --ph-bg:var(--ph-ech-bg)}
.prog-bloc.ph-corps{--ph-c:var(--ph-corps-c); --ph-bg:var(--ph-corps-bg)}
.prog-bloc.ph-calme{--ph-c:var(--ph-calme-c); --ph-bg:var(--ph-calme-bg)}
.phases{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap}
.phases span{font-size:11px; font-weight:600; padding:2px 8px; border-radius:99px; color:#fff}
.ph-ko{display:block; font-size:13px; font-weight:600; padding:10px; border:1px dashed var(--line); border-radius:10px; text-align:center}
.meth{display:inline-block; font-size:11px; font-weight:600; color:var(--muted); background:var(--seg); border-radius:6px; padding:2px 6px; margin-right:6px; vertical-align:1px}
details.prog{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:0}
details.prog summary{list-style:none; cursor:pointer; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px}
details.prog summary::-webkit-details-marker{display:none}
details.prog[open] summary{border-bottom:1px solid var(--line)}
details.prog .body{padding:4px 16px 14px}
details.mois{background:var(--surface); border:1px solid var(--line); border-radius:16px}
details.mois > summary{list-style:none; cursor:pointer; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px}
details.mois > summary::-webkit-details-marker{display:none}
details.mois > summary .chev{transition:transform .15s}
details.mois[open] > summary .chev{transform:rotate(180deg)}
details.mois .mois-body{padding:0 10px 10px; display:flex; flex-direction:column; gap:8px}
details.mois details.prog{background:var(--bg)}
/* ---------- onglet Saison (périodisation) */
:root{--mac-gen-bg:#EAF3DE; --mac-gen-fg:#27500A; --mac-spe-bg:#FAEEDA; --mac-spe-fg:#633806; --mac-comp-bg:#FCEBEB; --mac-comp-fg:#791F1F; --mac-trans-bg:#F1EFE8; --mac-trans-fg:#444441; --mac-autre-bg:#ECEDE9; --mac-autre-fg:#4A5059;
  --mt-dev:#378ADD; --mt-choc:#D85A30; --mt-recup:#1D9E75; --mt-aff:#7F77DD; --mt-comp:#E24B4A; --mt-maint:#888780; --mt-vide:var(--line)}
:root[data-theme="galaxie"]{--mac-gen-bg:#2C4A16; --mac-gen-fg:#C0DD97; --mac-spe-bg:#5A3A0A; --mac-spe-fg:#FAC775; --mac-comp-bg:#6A1F1F; --mac-comp-fg:#F7C1C1; --mac-trans-bg:#2C2C2A; --mac-trans-fg:#D3D1C7; --mac-autre-bg:#1C1828; --mac-autre-fg:#BDB7D3;
  --mt-dev:#2F5FA8; --mt-choc:#9A4423; --mt-recup:#167A5C; --mt-aff:#5B4FC4; --mt-comp:#A83434; --mt-maint:#5F5E5A}
.mac-gen{background:var(--mac-gen-bg); color:var(--mac-gen-fg)} .mac-spe{background:var(--mac-spe-bg); color:var(--mac-spe-fg)} .mac-comp{background:var(--mac-comp-bg); color:var(--mac-comp-fg)}
.mac-trans{background:var(--mac-trans-bg); color:var(--mac-trans-fg)} .mac-autre{background:var(--mac-autre-bg); color:var(--mac-autre-fg)}
.mt-dev{background:var(--mt-dev)} .mt-choc{background:var(--mt-choc)} .mt-recup{background:var(--mt-recup)} .mt-aff{background:var(--mt-aff)} .mt-comp{background:var(--mt-comp)} .mt-maint{background:var(--mt-maint)} .mt-vide{background:var(--mt-vide)}
.pill.mt{color:#fff}
/* frise : plan annuel (mois, macro, méso, barres de charge prévue colorées par type de microcycle) */
.frise{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; margin:12px -4px 0; padding:0 4px}
.frise::-webkit-scrollbar{display:none}
.fr-ligne{display:flex}
.fr-ligne>div{flex:none; overflow:hidden; white-space:nowrap}
.fr-mois>div{font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; padding:0 0 4px 4px; border-left:1px solid var(--line)}
.fr-mac>div,.fr-meso>div{height:20px; margin-right:3px; border-radius:6px; font-size:10px; font-weight:700; display:flex; align-items:center; padding:0 6px; text-overflow:ellipsis}
.fr-mac{margin-bottom:4px}
.fr-meso>div{height:18px; background:transparent; border:1px solid var(--line); color:var(--ink); font-weight:600; border-left-width:3px}
.fr-barres{height:96px; margin-top:6px}
.fr-barres .ua{font-size:9px; font-weight:700; color:var(--ink); margin-bottom:2px}
.fr-barres .t{width:24px; height:30px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px; font-weight:800}
.fr-barres>div{width:30px; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; position:relative; border-radius:8px}
.fr-barres>div.cur{background:var(--ok-bg)}
.fr-barres .b{width:20px; border-radius:5px 5px 2px 2px}
.fr-barres .f{font-size:11px; color:var(--alert-bg); line-height:1; margin-bottom:3px}
.fr-barres .auj{position:absolute; top:3px; left:0; right:0; text-align:center; font-size:8px; font-weight:700; color:var(--link); text-transform:uppercase}
.fr-dates>div{width:30px; text-align:center; font-size:9px; line-height:1.25; color:var(--muted); padding-top:4px}
.fr-dates b{font-size:10px; color:var(--ink)}
.fr-dates>div.cur{color:var(--link); font-weight:700}
.sem-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}
.sem-row:last-child{border-bottom:none}
.sem-row .barre{width:4px; align-self:stretch; border-radius:2px; flex:none}
.meso{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 0 11px 10px; border-bottom:1px solid var(--line); border-left:4px solid var(--line)}
.meso:last-child{border-bottom:none}
.dots{letter-spacing:2px; color:var(--link)} .dots span{color:var(--line)}
.card.install{border:1px solid var(--accent); background:var(--ok-bg); color:var(--ink)}
.outil{display:grid; grid-template-columns:minmax(0,1fr) minmax(260px,auto); gap:12px; align-items:center}
@media (max-width:620px){.outil{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}
</style>

<script>
(function(){
'use strict';
var app=document.getElementById('app');
var VERSION='13/11 · liens GitHub';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseKey(s){if(!s)return null; var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s)); return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function today(){var d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addDays(d,n){var x=new Date(d); x.setDate(x.getDate()+n); return x}
function diffDays(a,b){return Math.round((a-b)/86400000)}
function fmtDate(d){return d? d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) :'–'}
function fmtLong(d){var s=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}); return s.charAt(0).toUpperCase()+s.slice(1)}
function fmtN(n){return n==null||isNaN(n)?'–':Math.round(n).toLocaleString('fr-FR')}
function num(v){var n=typeof v==='number'?v:parseFloat(String(v).replace(',','.')); return isFinite(n)?n:null}
function load(s){var d=num(s.duree), r=num(s.rpe); return (d!=null&&r!=null)?d*r:null}
function wscore(w){var t=0; for(var i=0;i<WITEMS.length;i++){var v=num(w[WITEMS[i][0]]); if(v==null)return null; t+=v} return t}
function initials(s){s=String(s||'?').trim(); return (s[0]||'?').toUpperCase()}
function mean(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:null}
function sd(a){if(a.length<2)return null; var m=mean(a); return Math.sqrt(a.reduce(function(x,y){return x+(y-m)*(y-m)},0)/(a.length-1))}

// ---------- calculs (mêmes règles que le classeur)
function metrics(seances,wellness,ref){
  var la=2/(P.fa+1), lc=2/(P.fc+1), acute=0, chronic=0, c7=0, p7=0, first=null, last=null, daily={};
  seances.forEach(function(s){var d=parseKey(s.date); if(!d)return; var L=load(s);
    if(!first||d<first)first=d; if(d<=ref&&(!last||d>last))last=d;
    if(L==null)return; var k=diffDays(ref,d); if(k<0||k>=P.hist)return;
    acute+=la*Math.pow(1-la,k)*L; chronic+=lc*Math.pow(1-lc,k)*L;
    if(k<P.fa)c7+=L; else if(k<2*P.fa)p7+=L;
    var kk=key(d); daily[kk]=(daily[kk]||0)+L;});
  var d7=[]; for(var i=6;i>=0;i--){var dd=addDays(ref,-i); d7.push({d:dd,v:daily[key(dd)]||0})}
  var vals=d7.map(function(x){return x.v}), sdd=sd(vals), mono=(sdd&&sdd>0)?mean(vals)/sdd:null;
  var variation=p7>0?c7/p7-1:null, ratio=chronic>=1?acute/chronic:null;
  var sc;
  if(c7===0&&chronic<1)sc='Pas de données';
  else if(first&&first>addDays(ref,-P.fc))sc='Historique < 28 j';
  else if(ratio!=null&&ratio>=P.ra)sc='Alerte';
  else if((ratio!=null&&ratio>=P.rv)||(variation!=null&&variation>=P.sv))sc='Vigilance';
  else sc='Normal';
  var tod=[],base=[];
  wellness.forEach(function(w){var d=parseKey(w.date); if(!d)return; var s=wscore(w); if(d<=ref&&(!last||d>last))last=d; if(s==null)return; var k=diffDays(ref,d);
    if(k===0)tod.push(s); else if(k>0&&k<=P.wb)base.push(s);});
  var wt=tod.length?mean(tod):null, bm=mean(base), bs=sd(base);
  var z=(wt!=null&&base.length>=P.zn&&bs>0)?(wt-bm)/bs:null;
  var sw=wt==null?'Non saisi':z==null?'Ligne de base en cours':z<=P.za?'Alerte':z<=P.zv?'Vigilance':'Normal';
  return {acute:acute,chronic:chronic,ratio:ratio,c7:c7,p7:p7,variation:variation,d7:d7,mono:mono,contrainte:mono!=null?c7*mono:null,
    sc:sc,wt:wt,n:base.length,z:z,sw:sw,last:last,since:last?diffDays(ref,last):null};
}
function weekly(seances,ref,n){
  var monday=addDays(ref,-((ref.getDay()+6)%7)), out=[];
  for(var i=n-1;i>=0;i--){var start=addDays(monday,-7*i), end=addDays(start,7), t=0;
    seances.forEach(function(s){var d=parseKey(s.date), L=load(s); if(d&&L!=null&&d>=start&&d<end&&d<=ref)t+=L});
    out.push({start:start,v:t,cur:i===0});}
  return out;
}

function appliquer(r){if(r.role==='coach'){PARAMS.c=r.c; S.roster=r.data; S.mode='coach'} else {PARAMS.a=r.a; PARAMS.k=r.k; setAth(r.data); S.mode='athlete'}}
function doLogin(code,silent){
  var dejaAffiche=false, brut=null;
  if(silent){try{brut=localStorage.getItem('suivi_data'); var r0=brut&&JSON.parse(brut); if(r0&&r0.code===code){appliquer(r0); dejaAffiche=true; S.maj=true; render()}}catch(e){brut=null}}
  if(!dejaAffiche){S.busy=true; S.error=null; render()}
  var t0=Date.now();
  call('login',[code]).then(function(r){S.busy=false; S.maj=false; S.chrono={total:Date.now()-t0, serveur:r.ms||0, page:Math.round(performance.now()), memoire:r.memoire, etapes:r.etapes||null}; store('suivi_code',code); r.code=code;
    var neuf=JSON.stringify(r); garder(r);
    if(!dejaAffiche||neuf!==brut){appliquer(r); render()} else render()})
  .catch(function(e){S.busy=false; S.maj=false; var m=errMsg(e);
    // blocage temporaire (trop de codes erronés) ou réseau absent : on garde la dernière version affichée, sans déconnecter
    if(dejaAffiche&&(/Trop de codes/i.test(m)||!/inconnu|invalide/i.test(m))){render(); toast(/Trop de codes/i.test(m)?'Accès momentanément bloqué : affichage de la dernière version':'Pas de connexion : affichage de la dernière version'); return}
    store('suivi_code',null); try{localStorage.removeItem('suivi_data')}catch(e2){} S.mode='login'; S.error=silent?null:m; render()});
}

// appel au script Google : direct (ancien lien, page servie par Google) ou par Internet (app sur GitHub Pages, via doPost)
function call(fn,args){
  if(CHEZ_GOOGLE)return new Promise(function(res,rej){var r=google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(e)}); r[fn].apply(r,args)});
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args||[]})})
    .then(function(r){if(!r.ok)throw new Error('Serveur indisponible ('+r.status+'), réessaie.'); return r.json()})
    .then(function(x){if(!x||!x.ok)throw new Error((x&&x.e)||'Erreur de connexion, réessaie.'); return x.r});
}
function errMsg(e){return (e&&e.message)?String(e.message).replace(/^Exception: /,''):'Erreur de connexion, réessaie.'}

function wEtat(){
  var R=S.regleW||{limite:11,correction:15}, now=new Date(), ex=S.myWellness.filter(function(x){return x.date===key(today())})[0];
  if(ex){ if(ex.saisi&&now.getTime()-ex.saisi<=R.correction*60000) return {st:'corr',ex:ex,fin:new Date(ex.saisi+R.correction*60000),R:R}; return {st:'lock',ex:ex,R:R}; }
  return {st:(now.getHours()+now.getMinutes()/60>=R.limite)?'ferme':'ouvert',R:R};
}

  else if(a==='saveSeance')saveSeance();
  else if(a==='login'){var v=(document.getElementById('lg-code')||{}).value||''; v=v.trim(); if(!v){toast('Entre ton code.');return} doLogin(v,false)}
  else if(a==='logout'){store('suivi_code',null); try{localStorage.removeItem('suivi_data')}catch(e){}
    PARAMS={}; S.profile=null; S.mySeances=[]; S.myWellness=[]; S.programme=[]; S.roster=null; S.chrono=null; S.tab='home'; S.error=null; S.busy=false; S.mode='login';
    window.scrollTo(0,0); render(); toast('Déconnecté')}
  else if(a==='saveW')saveW();
  else if(a==='zoom')zoomPhoto(v);
  else if(a==='theme'){setTheme(v); render()}
  else if(a==='installer'){if(INSTALL.prompt){var pr=INSTALL.prompt; INSTALL.prompt=null; pr.prompt(); pr.userChoice.then(function(){render()}).catch(function(){})}}
  else if(a==='installPlusTard'){store('suivi_install_masque',String(Date.now())); render()}
  else if(a==='outil'){var ov={}; ov[b.getAttribute('data-k')]=v; majOutils(b.getAttribute('data-a'),ov)}
  else if(a==='outilsBase'){var ob={}; ((S.roster&&S.roster.catalogue)||[]).forEach(function(t){ob[t.id]=''}); majOutils(b.getAttribute('data-a'),ob)}
});
app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='lg-code'){var b=app.querySelector('[data-act="login"]'); if(b)b.click(); return} if(e.key==='Enter'){var tr=e.target.closest('tr[data-act]'); if(tr){tr.click()}}});
app.addEventListener('input',function(e){var t=e.target;
  if(t.id==='f-dur'){S.form.duree=t.value; var L=num(t.value)!=null?num(t.value)*S.form.rpe:null; var c=document.getElementById('f-charge'); if(c)c.textContent=(L!=null?fmtN(L):'–')+' UA'; var fo=document.getElementById('f-form'); if(fo)fo.textContent='RPE '+S.form.rpe+' × '+(t.value||'?')+' min'}
  else if(t.id==='f-date')S.form.date=t.value;
  else if(t.id==='f-com')S.form.comment=t.value;
  else if(t.id==='f-int')S.form.intitule=t.value;
  else if(t.id==='lg-code')S.lg=t.value;
  else if(t.id==='w-dur')S.wform.duree=t.value===''?null:num(t.value);
});
function saveSeance(){
  var f=S.form, d=num(f.duree); if(d==null||d<=0||d>600){toast('Indique une durée entre 1 et 600 minutes.');return}
  S.busy=true; render();
  call('saveSeance',[PARAMS.a,PARAMS.k,{date:f.date||key(today()),type:f.type,intitule:f.intitule,duree:d,rpe:f.rpe,comment:f.comment}])
  .then(function(data){setAth(data); S.busy=false; S.form={type:f.type,rpe:6,duree:60,date:null,comment:'',intitule:''}; S.tab='home'; render(); toast('Séance enregistrée : '+fmtN(d*f.rpe)+' UA')})
  .catch(function(e){S.busy=false; render(); toast(errMsg(e))});
}
function saveW(){
  var f=S.wform, doc={date:key(today()),dureeSommeil:f.duree==null?null:f.duree};
  WITEMS.forEach(function(it){doc[it[0]]=f[it[0]]});
  S.busy=true; render();
  call('saveWellness',[PARAMS.a,PARAMS.k,doc]).then(function(data){setAth(data); S.busy=false; S.wform={}; S.tab='home'; render(); toast('Wellness enregistré : '+wscore(doc)+'/25')})
  .catch(function(e){S.busy=false; render(); toast(errMsg(e))});
}

// ---------- démarrage
if(CODE_LIEN){doLogin(CODE_LIEN,stored('suivi_code')===CODE_LIEN)}
else if(PARAMS.c){loadCoach()}
else if(PARAMS.a&&PARAMS.k){call('getAthleteData',[PARAMS.a,PARAMS.k]).then(function(d){setAth(d); S.mode='athlete'; render()}).catch(function(e){S.mode='error'; S.error=errMsg(e); render()})}
else {var sc=stored('suivi_code'); if(sc){doLogin(sc,true)} else {S.mode='login'; render()}}
})();
</script>
</body>
</html>
