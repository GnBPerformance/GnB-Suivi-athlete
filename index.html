<style>
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --line:#E1E3DC; --ink:#15181D; --muted:#5B616B;
  --accent:#2346C8; --on-accent:#FFFFFF; --link:#2346C8;
  --block:#15181D; --on-block:#FFFFFF; --on-block-muted:#C4C8CF; --seg:#E4E6E0; --bar-past:#B9C0CC;
  --ok-bg:#E4EAFB; --ok-fg:#1D3AA8; --warn-bg:#FBE4CF; --warn-fg:#7E3F0E;
  --alert-bg:#A3341A; --alert-fg:#FFFFFF; --na-bg:#ECEDE9; --na-fg:#4A5059;
  --hl:#9CB0FF;
  --f-ok:#2E7D5B; --f-warn:#C2620F; --f-alert:#A3341A; --f-na:#9AA0A8;
  --ty-1:#2346C8; --ty-2:#2E7D5B; --ty-3:#C2620F; --ty-4:#8A919C;
  --ph-ech-c:#C2620F; --ph-ech-bg:#FDF2E6; --ph-corps-c:#2346C8; --ph-corps-bg:#F1F4FD; --ph-calme-c:#2E7D5B; --ph-calme-bg:#EBF6F0;
  --display:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --body:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);   /* le haut (encoche du téléphone) est géré par le bandeau .topbar */
}
/* ---------- thème « Galaxie » (test) : fond noir, détails violet profond tirant sur le bleu */
:root:is([data-theme="galaxie"],[data-theme="gnb"]){
  color-scheme:dark;
  --bg:#06050B; --surface:#110E1C; --line:#2A2442; --ink:#EEEBF8; --muted:#A6A0BF;
  --accent:#5B3BE6; --on-accent:#FFFFFF; --link:#B3A4FF;
  --block:#171230; --on-block:#FFFFFF; --on-block-muted:#B8B0D6; --seg:#1A1529; --bar-past:#3D3560;
  --ok-bg:#221A4A; --ok-fg:#C9BEFF; --warn-bg:#3D2410; --warn-fg:#FFC99A;
  --alert-bg:#C0392B; --alert-fg:#FFFFFF; --na-bg:#1C1828; --na-fg:#BDB7D3;
  --hl:#B9A8FF;
  --f-ok:#3FBF86; --f-warn:#F0A04B; --f-alert:#E5534B; --f-na:#5A5470;
  --ty-1:#7C5CFF; --ty-2:#3FBF86; --ty-3:#F0A04B; --ty-4:#6E6890;
  --ph-ech-c:#C9651A; --ph-ech-bg:rgba(201,101,26,.10); --ph-corps-c:#6A4BF0; --ph-corps-bg:rgba(106,75,240,.11); --ph-calme-c:#2E8F64; --ph-calme-bg:rgba(46,143,100,.11);
  --grad:linear-gradient(135deg,#3B1FA8 0%,#5B3BE6 55%,#2F45D0 100%);
  --grad-block:linear-gradient(160deg,#1E1640 0%,#110D22 100%);
  --glow:0 6px 24px rgba(91,59,230,.35);
}
:is([data-theme="galaxie"],[data-theme="gnb"]) body{background:
  radial-gradient(900px 520px at 85% -8%, rgba(91,59,230,.30), transparent 62%),
  radial-gradient(760px 480px at -12% 38%, rgba(47,69,208,.18), transparent 60%),
  radial-gradient(700px 420px at 60% 110%, rgba(110,40,200,.16), transparent 60%),
  #06050B; background-attachment:fixed}
:is([data-theme="galaxie"],[data-theme="gnb"]) body::before{content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.55;
  background-image:
    radial-gradient(1px 1px at 12% 18%, #fff, transparent 60%), radial-gradient(1px 1px at 72% 9%, #d9d0ff, transparent 60%),
    radial-gradient(1.5px 1.5px at 38% 42%, #fff, transparent 60%), radial-gradient(1px 1px at 88% 36%, #cfc4ff, transparent 60%),
    radial-gradient(1px 1px at 22% 74%, #fff, transparent 60%), radial-gradient(1.5px 1.5px at 64% 66%, #e3dcff, transparent 60%),
    radial-gradient(1px 1px at 92% 82%, #fff, transparent 60%), radial-gradient(1px 1px at 50% 92%, #d9d0ff, transparent 60%);
  background-size:420px 520px}
:is([data-theme="galaxie"],[data-theme="gnb"]) #app{position:relative; z-index:1}
:is([data-theme="galaxie"],[data-theme="gnb"]) .card{background:rgba(17,14,28,.88)}
:is([data-theme="galaxie"],[data-theme="gnb"]) .card.accent,:is([data-theme="galaxie"],[data-theme="gnb"]) .btn.primary,:is([data-theme="galaxie"],[data-theme="gnb"]) .avatar.blue{background:var(--grad)}
:is([data-theme="galaxie"],[data-theme="gnb"]) .card.accent,:is([data-theme="galaxie"],[data-theme="gnb"]) .btn.primary{box-shadow:var(--glow)}
:is([data-theme="galaxie"],[data-theme="gnb"]) .card.block,:is([data-theme="galaxie"],[data-theme="gnb"]) .coachhead{background:var(--grad-block); border:1px solid rgba(150,120,255,.20)}
:is([data-theme="galaxie"],[data-theme="gnb"]) .btn.dark{background:var(--grad-block); border:1px solid rgba(150,120,255,.28)}
:is([data-theme="galaxie"],[data-theme="gnb"]) .btn.light{background:#FFFFFF; color:#1A1340}
:is([data-theme="galaxie"],[data-theme="gnb"]) .blue-t,:is([data-theme="galaxie"],[data-theme="gnb"]) th,:is([data-theme="galaxie"],[data-theme="gnb"]) .prog-ex .dose{color:var(--link)}
:is([data-theme="galaxie"],[data-theme="gnb"]) .btn.ghost.blue{border-color:var(--link); color:var(--link)}
:is([data-theme="galaxie"],[data-theme="gnb"]) .bar{background:linear-gradient(180deg,#8E72FF,#4B32D6)}
:is([data-theme="galaxie"],[data-theme="gnb"]) .bar.past{background:var(--bar-past)}
:is([data-theme="galaxie"],[data-theme="gnb"]) .bar.empty{background:var(--line)}
:is([data-theme="galaxie"],[data-theme="gnb"]) .num[aria-pressed="true"],:is([data-theme="galaxie"],[data-theme="gnb"]) .chip[aria-pressed="true"],:is([data-theme="galaxie"],[data-theme="gnb"]) .mode button[aria-pressed="true"]{background:var(--grad); border-color:transparent; box-shadow:0 4px 14px rgba(91,59,230,.35)}
:is([data-theme="galaxie"],[data-theme="gnb"]) .seg button[aria-pressed="true"]{background:#2C2258; color:#FFFFFF; box-shadow:inset 0 0 0 1px rgba(179,164,255,.35)}
:is([data-theme="galaxie"],[data-theme="gnb"]) nav.tabs{background:rgba(9,7,16,.86); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border-top-color:rgba(150,120,255,.18)}
:is([data-theme="galaxie"],[data-theme="gnb"]) nav.tabs button[aria-current="page"]{color:var(--link); text-shadow:0 0 12px rgba(179,164,255,.55)}
:is([data-theme="galaxie"],[data-theme="gnb"]) .prog-ex .ph{background:#0D0B16}
:is([data-theme="galaxie"],[data-theme="gnb"]) .prog-bloc .prog-ex{border-top-color:rgba(255,255,255,.08)}
:is([data-theme="galaxie"],[data-theme="gnb"]) .zoom{background:rgba(5,4,10,.94)}
/* ---------- thème « GnB » (par défaut depuis le 17/11/2026) : couleurs du logo, noir, rouge vif, blanc. Le logo lui-même n'est pas affiché.
   Le rouge est la couleur de la marque : les alertes passent donc en orange, pour ne pas être confondues avec elle. */
:root[data-theme="gnb"]{
  color-scheme:dark;
  --bg:#0A0A0B; --surface:#141416; --line:#2A2A2E; --ink:#F4F4F5; --muted:#A1A1AA;
  --accent:#E1161E; --on-accent:#FFFFFF; --link:#FF5A5F;
  --block:#18181B; --on-block:#FFFFFF; --on-block-muted:#B4B4BB; --seg:#1C1C1F; --bar-past:#3F3F46;
  --ok-bg:#26262A; --ok-fg:#F4F4F5; --warn-bg:#3A2A0E; --warn-fg:#FFC861;
  --alert-bg:#E8590C; --alert-fg:#FFFFFF; --na-bg:#1C1C1F; --na-fg:#B4B4BB;
  --hl:#FF5A5F;
  --f-ok:#3FBF86; --f-warn:#F5B83D; --f-alert:#F0702B; --f-na:#52525B;
  --ty-1:#E1161E; --ty-2:#E4E4E7; --ty-3:#F5B83D; --ty-4:#52525B;
  --ph-ech-c:#F0702B; --ph-ech-bg:rgba(240,112,43,.10); --ph-corps-c:#E1161E; --ph-corps-bg:rgba(225,22,30,.10); --ph-calme-c:#3FBF86; --ph-calme-bg:rgba(63,191,134,.10);
  --grad:linear-gradient(135deg,#B3121A 0%,#E1161E 100%);
  --grad-block:linear-gradient(160deg,#1C1C1F 0%,#111113 100%);
  --glow:0 6px 22px rgba(225,22,30,.28);
}
[data-theme="gnb"] body{background:#0A0A0B}
[data-theme="gnb"] body::before{display:none}
[data-theme="gnb"] .card{background:#141416}
[data-theme="gnb"] .card.block,[data-theme="gnb"] .coachhead{border:1px solid #2A2A2E; border-left:3px solid var(--accent)}
[data-theme="gnb"] .btn.dark{border:1px solid #2A2A2E}
[data-theme="gnb"] .bar{background:linear-gradient(180deg,#FF3B42,#B3121A)}
[data-theme="gnb"] .num[aria-pressed="true"],[data-theme="gnb"] .chip[aria-pressed="true"],[data-theme="gnb"] .mode button[aria-pressed="true"]{box-shadow:0 4px 14px rgba(225,22,30,.30)}
[data-theme="gnb"] .seg button[aria-pressed="true"]{background:#2A2A2E; box-shadow:inset 0 0 0 1px rgba(255,90,95,.35)}
[data-theme="gnb"] nav.tabs{background:rgba(10,10,11,.92); border-top-color:#2A2A2E}
[data-theme="gnb"] nav.tabs button[aria-current="page"]{text-shadow:none}
[data-theme="gnb"] .prog-ex .ph{background:#0E0E10}
[data-theme="gnb"] .zoom{background:rgba(5,5,6,.95)}
[data-theme="gnb"] .kpi{background:rgba(255,255,255,.05)}
/* ---------- bandeau du haut (nom GnB Performance), fixe en haut de l'écran */
.topbar{position:sticky; top:0; z-index:6; background:var(--bg); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px)}
[data-theme="gnb"] .topbar{background:rgba(10,10,11,.94); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px)}
:is([data-theme="galaxie"]) .topbar{background:rgba(9,7,16,.9); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px)}
.topbar .in{max-width:1080px; margin:0 auto; height:48px; padding:0 20px; display:flex; align-items:center; justify-content:space-between; gap:12px}
.marque{display:inline-flex; align-items:baseline; gap:7px; font-family:var(--display); letter-spacing:.2px; white-space:nowrap}
.marque b{font-weight:800; font-style:italic; font-size:20px; color:var(--ink)}
.marque span{font-weight:700; font-size:11px; letter-spacing:2.2px; text-transform:uppercase; color:var(--accent)}
.topbar .role{font-size:12px; color:var(--muted); white-space:nowrap}
.topbar .actu{background:none; border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:5px 10px; font:inherit; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap} .topbar .actu:disabled{opacity:.6; cursor:default}
.marque-login{display:flex; align-items:baseline; gap:10px; font-family:var(--display)}
.marque-login b{font-weight:800; font-style:italic; font-size:44px; line-height:1; color:var(--ink)}
.marque-login span{font-weight:700; font-size:13px; letter-spacing:3px; text-transform:uppercase; color:var(--accent)}
/* ---------- vue préparateur : barre d'actions (trois boutons égaux, jamais hors de l'écran) et outils actifs */
.actions-coach{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:14px}
.actions-coach .btn{height:44px; padding:0 8px; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
@media (min-width:720px){.actions-coach{display:flex; justify-content:flex-end}.actions-coach .btn{padding:0 16px; font-size:14px}}
.actif{display:flex; justify-content:space-between; align-items:center; gap:10px; padding-bottom:10px; border-bottom:1px solid var(--line)}
.actif:last-of-type{border-bottom:none}
.actif .attente{color:var(--f-warn)}
/* ---------- style « Bento » (17/11/2026, choisi par lui parmi 8 propositions) : tuiles serrées aux coins nets, sans contour,
   titres et chiffres en lettres étroites sportives (Barlow Condensed), aplats sans dégradé ni halo.
   Le style d'avant (« Classique » : grandes cartes arrondies) reste disponible : data-style="classique" sur <html>,
   choisi dans Progrès > Style (athlète) ou par le bouton Style (préparateur). Pour revenir en arrière pour tout le monde :
   mettre data-style="classique" par défaut dans la balise <html> et dans themeStyle(). */
[data-style="bento"]{--display:'Barlow Condensed','Archivo','Helvetica Neue',Arial,sans-serif}
[data-style="bento"] .card,[data-style="bento"] .item,[data-style="bento"] details.prog,[data-style="bento"] details.mois,[data-style="bento"] .tablebox{border:none; border-radius:8px}
[data-style="bento"] .card{padding:14px}
[data-style="bento"][data-theme="gnb"] .card,[data-style="bento"][data-theme="gnb"] .item,[data-style="bento"][data-theme="gnb"] details.prog,[data-style="bento"][data-theme="gnb"] details.mois,[data-style="bento"][data-theme="gnb"] .tablebox{background:#16161A}
[data-style="bento"][data-theme="gnb"] .card details.prog{background:#1E1E23}
[data-style="bento"] .card.accent,[data-style="bento"] .btn.primary{background:var(--accent); box-shadow:none}
[data-style="bento"] .card.block,[data-style="bento"] .coachhead{border:none; border-radius:8px; background:var(--block)}
[data-style="bento"][data-theme="gnb"] .card.block,[data-style="bento"][data-theme="gnb"] .coachhead{background:#16161A}
[data-style="bento"] .card.forme{border-left:4px solid var(--f-na); border-radius:0 8px 8px 0}
[data-style="bento"] .card.forme.f-ok{border-left-color:var(--f-ok)} [data-style="bento"] .card.forme.f-warn{border-left-color:var(--f-warn)} [data-style="bento"] .card.forme.f-alert{border-left-color:var(--f-alert)}
/* les cartes mises en avant par un contour (retour, bilan du mois, reprise, installation) : un trait à gauche au lieu d'un cadre */
[data-style="bento"] .card[style*="var(--accent)"],[data-style="bento"] .card.install{border:none!important; border-left:3px solid var(--accent)!important; border-radius:0 8px 8px 0}
[data-style="bento"] .card[style*="var(--f-warn)"]{border:none!important; border-left:3px solid var(--f-warn)!important; border-radius:0 8px 8px 0}
[data-style="bento"] .wrap.stack{gap:8px}
[data-style="bento"] .two{gap:6px}
[data-style="bento"] .sect{margin-top:18px}
[data-style="bento"] .sect h2{font-size:24px; text-transform:uppercase; letter-spacing:.3px}
[data-style="bento"] h1.title{text-transform:uppercase; font-size:34px; letter-spacing:.2px; line-height:1}
[data-style="bento"] h3{font-weight:700; font-size:19px!important; letter-spacing:.2px}
[data-style="bento"] .big{font-size:48px; letter-spacing:-.5px}
[data-style="bento"] .btn{border-radius:8px; font-family:var(--body)}
[data-style="bento"] .btn.ghost{border-color:#2A2A2E}
[data-style="bento"] .num{border-radius:6px; font-size:19px}
[data-style="bento"] .chip{border-radius:6px}
[data-style="bento"] .field{border-radius:8px}
[data-style="bento"] .seg{border-radius:8px} [data-style="bento"] .seg button{border-radius:6px}
[data-style="bento"] .kpi{border-radius:6px} [data-style="bento"] .kpi b{font-size:30px}
[data-style="bento"] .notice{border-radius:8px}
[data-style="bento"] .avatar{border-radius:8px}
[data-style="bento"] .bar{border-radius:2px}
[data-style="bento"] .prog-bloc{border-radius:0 6px 6px 0}
[data-style="bento"] .prog-ex .ph{border-radius:6px}
[data-style="bento"] .toast{border-radius:8px}
[data-style="bento"] .bars.sem .bar-col span,[data-style="bento"] .bar-col span{font-family:var(--body)}
/* ---------- style « Anneaux » (17/11/2026, 3e choix à l'essai, idée G) : pas de boîtes, des listes épurées séparées par des filets,
   des anneaux de la semaine en haut de l'Accueil (anneauxCard), titres en écriture normale (pas de majuscules), chiffres étroits */
[data-style="anneaux"]{--display:'IBM Plex Sans','Segoe UI',system-ui,sans-serif}
[data-style="anneaux"] h1.title{font-weight:600; font-size:26px; letter-spacing:-.4px}
[data-style="anneaux"] h3{font-weight:600}
[data-style="anneaux"] .big,[data-style="anneaux"] .kpi b,[data-style="anneaux"] .anneau-c{font-family:'Barlow Condensed','Archivo',Arial,sans-serif; font-weight:800}
[data-style="anneaux"] .card,[data-style="anneaux"] .item,[data-style="anneaux"] details.prog,[data-style="anneaux"] details.mois,[data-style="anneaux"] .card.block,[data-style="anneaux"] .coachhead{background:transparent!important; border:none!important; border-bottom:1px solid var(--line)!important; border-radius:0!important; box-shadow:none!important; padding-left:0; padding-right:0}
[data-style="anneaux"] .card.block,[data-style="anneaux"] .coachhead{color:var(--ink)}
[data-style="anneaux"] .card.block .muted,[data-style="anneaux"] .coachhead .tiny,[data-style="anneaux"] .coachhead .small{color:var(--muted)!important}
[data-style="anneaux"] .coachhead h1.title{color:var(--ink)!important}
[data-style="anneaux"] details.prog summary,[data-style="anneaux"] details.mois > summary{padding-left:0; padding-right:0}
[data-style="anneaux"] details.prog .body{padding-left:0; padding-right:0}
[data-style="anneaux"] details.mois .mois-body{padding:0 0 8px}
[data-style="anneaux"] details.prog[open] summary{border-bottom:none}
[data-style="anneaux"] .card.accent{background:var(--accent)!important; border:none!important; border-radius:14px!important; padding:16px!important; color:var(--on-accent)}
[data-style="anneaux"] .card.forme,[data-style="anneaux"] .card[style*="var(--accent)"],[data-style="anneaux"] .card[style*="var(--f-warn)"],[data-style="anneaux"] .card.install{border-left:3px solid var(--accent)!important; padding-left:12px!important}
[data-style="anneaux"] .card.forme.f-ok{border-left-color:var(--f-ok)!important} [data-style="anneaux"] .card.forme.f-warn,[data-style="anneaux"] .card[style*="var(--f-warn)"]{border-left-color:var(--f-warn)!important} [data-style="anneaux"] .card.forme.f-alert{border-left-color:var(--f-alert)!important}
[data-style="anneaux"] .tablebox{border:none; border-top:1px solid var(--line); border-radius:0; background:transparent}
[data-style="anneaux"] .wrap.stack{gap:4px}
[data-style="anneaux"] .two{gap:16px}
[data-style="anneaux"] .btn{border-radius:12px}
[data-style="anneaux"] .num{border-radius:10px} [data-style="anneaux"] .seg{border-radius:10px}
[data-style="anneaux"] .kpi{background:var(--seg); border-radius:12px}
[data-style="anneaux"] .actif{border-bottom-color:var(--line)}
.anneaux{display:flex; flex-direction:column; align-items:center; gap:10px; padding:8px 0 16px; border-bottom:1px solid var(--line)}
.anneaux svg{display:block}
.anneaux .leg{display:flex; gap:16px; flex-wrap:wrap; justify-content:center; font-size:12px; color:var(--muted)}
.anneaux .leg i{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:-1px}
/* ---------- l'écran ne glisse jamais sur le côté : seuls les tableaux défilent, à l'intérieur de leur cadre */
/* « clip » et non « hidden » : hidden casserait le bandeau fixe du haut (position sticky) */
html,body{overflow-x:clip; max-width:100%}
body{overscroll-behavior-x:none}
#app{overflow-x:clip}
.tablebox{max-width:100%; -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain}
.wrap{width:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.45; min-height:100%}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h1,h2,h3{font-family:var(--display); margin:0; letter-spacing:-0.3px}
a{color:var(--link)}
.wrap{max-width:480px; margin:0 auto; padding:24px 20px 110px}
.wrap.wide{max-width:1080px; padding-bottom:48px}
.row{display:flex; align-items:center; gap:12px}
.between{justify-content:space-between}
.stack{display:flex; flex-direction:column; gap:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px}
.card.accent{background:var(--accent); color:var(--on-accent); border:none}
.card.block{background:var(--block); color:var(--on-block); border:none}
.card.block .muted{color:var(--on-block-muted)}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseKey(s){if(!s)return null; var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s)); return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function today(){var d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addDays(d,n){var x=new Date(d); x.setDate(x.getDate()+n); return x}
function diffDays(a,b){return Math.round((a-b)/86400000)}
function fmtDate(d){return d? d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) :'–'}
function fmtLong(d){var s=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}); return s.charAt(0).toUpperCase()+s.slice(1)}
function fmtN(n){return n==null||isNaN(n)?'–':Math.round(n).toLocaleString('fr-FR')}
function num(v){var n=typeof v==='number'?v:parseFloat(String(v).replace(',','.')); return isFinite(n)?n:null}
function load(s){var d=num(s.duree), r=num(s.rpe); return (d!=null&&r!=null)?d*r:null}
function wscore(w){var t=0; for(var i=0;i<WITEMS.length;i++){var v=num(w[WITEMS[i][0]]); if(v==null)return null; t+=v} return t}
function initials(s){s=String(s||'?').trim(); return (s[0]||'?').toUpperCase()}
function mean(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:null}
function sd(a){if(a.length<2)return null; var m=mean(a); return Math.sqrt(a.reduce(function(x,y){return x+(y-m)*(y-m)},0)/(a.length-1))}

// ---------- calculs (mêmes règles que le classeur)
function metrics(seances,wellness,ref){
  var la=2/(P.fa+1), lc=2/(P.fc+1), acute=0, chronic=0, c7=0, p7=0, first=null, last=null, daily={};
  seances.forEach(function(s){var d=parseKey(s.date); if(!d)return; var L=load(s);
    if(!first||d<first)first=d; if(d<=ref&&(!last||d>last))last=d;
    if(L==null)return; var k=diffDays(ref,d); if(k<0||k>=P.hist)return;
    acute+=la*Math.pow(1-la,k)*L; chronic+=lc*Math.pow(1-lc,k)*L;
    if(k<P.fa)c7+=L; else if(k<2*P.fa)p7+=L;
    var kk=key(d); daily[kk]=(daily[kk]||0)+L;});
  var d7=[]; for(var i=6;i>=0;i--){var dd=addDays(ref,-i); d7.push({d:dd,v:daily[key(dd)]||0})}
  var vals=d7.map(function(x){return x.v}), sdd=sd(vals), mono=(sdd&&sdd>0)?mean(vals)/sdd:null;
  var variation=p7>0?c7/p7-1:null, ratio=chronic>=1?acute/chronic:null;
  var sc;
  if(c7===0&&chronic<1)sc='Pas de données';
  else if(first&&first>addDays(ref,-P.fc))sc='Historique < 28 j';
  else if(ratio!=null&&ratio>=P.ra)sc='Alerte';
  else if((ratio!=null&&ratio>=P.rv)||(variation!=null&&variation>=P.sv))sc='Vigilance';
  else sc='Normal';
  var tod=[],base=[];
  wellness.forEach(function(w){var d=parseKey(w.date); if(!d)return; var s=wscore(w); if(d<=ref&&(!last||d>last))last=d; if(s==null)return; var k=diffDays(ref,d);
    if(k===0)tod.push(s); else if(k>0&&k<=P.wb)base.push(s);});
  var wt=tod.length?mean(tod):null, bm=mean(base), bs=sd(base);
  var z=(wt!=null&&base.length>=P.zn&&bs>0)?(wt-bm)/bs:null;
  var sw=wt==null?'Non saisi':z==null?'Ligne de base en cours':z<=P.za?'Alerte':z<=P.zv?'Vigilance':'Normal';
  return {acute:acute,chronic:chronic,ratio:ratio,c7:c7,p7:p7,variation:variation,d7:d7,mono:mono,contrainte:mono!=null?c7*mono:null,
    sc:sc,wt:wt,n:base.length,z:z,sw:sw,last:last,since:last?diffDays(ref,last):null};
}
function weekly(seances,ref,n){
  var monday=addDays(ref,-((ref.getDay()+6)%7)), out=[];
  for(var i=n-1;i>=0;i--){var start=addDays(monday,-7*i), end=addDays(start,7), t=0;
    seances.forEach(function(s){var d=parseKey(s.date), L=load(s); if(d&&L!=null&&d>=start&&d<end&&d<=ref)t+=L});
    out.push({start:start,v:t,cur:i===0});}
  return out;
}

    '<div class="fr-ligne fr-barres">'+w.map(function(s,i){var k=cleType(s.type), fait=fini||i<=ci, ua=UA[s.lundi]||0;

    '<div class="fr-ligne fr-dates">'+w.map(function(s,i){return '<div'+(i===ci?' class="cur"':'')+'><b>S'+(s.n||i+1)+'</b><br>'+fmtDate(parseKey(s.lundi))+'</div>'}).join('')+'</div>'+
    '</div></div>'+
    '<div class="legend" style="margin-top:12px">'+w.map(function(s){return s.type}).filter(function(x,i,a){return x&&a.indexOf(x)===i}).map(function(x){return '<span><span class="dot mt-'+cleType(x)+'" style="'+bgType(x)+'"></span>'+esc(initType(x))+' · '+esc(x)+'</span>'}).join('')+(w.some(function(s){return s.stage})?'<span><span class="dot" style="'+stStage()+'"></span>▲ échéance</span>':'')+'</div>'+
    '<p class="tiny muted" style="margin:8px 0 0">1 colonne = 1 semaine (S1 = 1re semaine, date de son lundi). Semaines passées : la barre montre les UA réellement faites. Semaines à venir : le type de semaine prévu. '+(w.length>9?'Glisse la frise pour tout voir.':'')+'</p></div>';

  var mesos=suites(w,'meso').filter(function(r){return r.v});

      return '<div class="meso" style="border-left-color:'+coulMeso(r.v,s.macro)+'"><div><div style="font-weight:600">'+esc(r.v)+'</div><div class="tiny muted">'+fmtDate(parseKey(s.lundi))+' → '+fmtDate(addDays(parseKey(w[r.fin].lundi),6))+((s.obj1||s.obj2)?' · '+esc([s.obj1,s.obj2].filter(function(x){return x}).join(', ')):'')+'</div></div>'+
        '<span class="pill '+(st==='En cours'?'s-ok':'s-na')+'">'+st+'</span></div>'}).join('')+'</div>':'';
  var plan=sur('Plan général',function(){return planGeneral(w,ci,avant,fini)});
  var ech=suites(w,'stage').filter(function(r){return r.v});

      return '<div class="meso" style="border-left-color:#E24B4A"><div><div style="font-weight:600">'+esc(r.v)+'</div><div class="tiny muted">'+fmtDate(parseKey(s.lundi))+' → '+fmtDate(addDays(parseKey(w[r.fin].lundi),6))+'</div></div><span class="pill '+(enc?'s-ok':passe?'s-na':'s-warn')+'">'+(enc?'En cours':passe?'Passé':dansSem(Math.round(diffDays(parseKey(s.lundi),lun)/7)))+'</span></div>'}).join('')+'</div>':'';
  return '<div class="wrap stack"><div><div class="small muted">Du '+fmtDate(parseKey(w[0].lundi))+' au '+fmtDate(addDays(parseKey(w[w.length-1].lundi),6))+'</div><h1 class="title">Ma planification</h1></div>'+carte+plan+proch+frise+le+liste+sur('Bilan de compétition',competCarte)+'</div>';

// vue générale de toute la planification, sans défilement : barre des macrocycles (aujourd'hui, ▲ échéances), puis chaque macrocycle avec ses mésocycles et ses échéances
function planGeneral(w,ci,avant,fini){
  var n=w.length, macs=suites(w,'macro'), ech=suites(w,'stage').filter(function(r){return r.v}), pct=function(a){return (a/n*100).toFixed(2)+'%'};
  var coul=function(v){return v?stMac(v):'background:var(--line)'}, cls=function(v){return v?'mac-'+cleMacro(v):''};
  var barre='<div class="pg-wrap"><div class="pg-barre">'+macs.map(function(r){return '<span class="'+cls(r.v)+'" style="width:'+pct(r.fin-r.deb+1)+';'+coul(r.v)+'" title="'+esc(r.v||'—')+'"></span>'}).join('')+'</div>'+(ci>=0?'<i class="pg-auj" style="left:'+pct(ci+0.5)+'"></i>':'')+'</div>'+
    (ech.length?'<div class="pg-marques">'+ech.map(function(r){return '<i style="left:'+pct(r.deb+0.5)+'" title="'+esc(r.v)+'">▲</i>'}).join('')+'</div>':'');
  var dates='<div class="row between tiny muted"><span>'+fmtDate(parseKey(w[0].lundi))+'</span>'+(ci>=0?'<span style="color:var(--accent);font-weight:700">▼ aujourd\'hui · semaine '+(ci+1)+'/'+n+'</span>':'')+'<span>'+fmtDate(addDays(parseKey(w[n-1].lundi),6))+'</span></div>';
  var etat=function(a,b){return avant?'À venir':(fini||b<ci)?'Terminé':a<=ci?'En cours':'À venir'};
  var per=function(a,b){return fmtDate(parseKey(w[a].lundi))+' → '+fmtDate(addDays(parseKey(w[b].lundi),6))};
  var blocs=macs.map(function(r){
    var mes=suites(w.slice(r.deb,r.fin+1),'meso').filter(function(x){return x.v}), ec=ech.filter(function(x){return x.deb>=r.deb&&x.deb<=r.fin});
    if(!r.v&&!mes.length&&!ec.length)return '';
    var s=etat(r.deb,r.fin), nb=r.fin-r.deb+1;
    return '<div class="pg-bloc"><div class="row between" style="gap:8px;align-items:flex-start"><div style="min-width:0"><div style="font-weight:700"><span class="dot '+cls(r.v)+'" style="'+coul(r.v)+'"></span>'+esc(r.v||'Sans macrocycle')+'</div><div class="tiny muted">'+per(r.deb,r.fin)+' · '+nb+' semaine'+(nb>1?'s':'')+'</div></div><span class="pill '+(s==='En cours'?'s-ok':'s-na')+'">'+s+'</span></div>'+
      mes.map(function(x){var a=r.deb+x.deb, b=r.deb+x.fin, s0=w[a]; return '<div class="pg-sous"><b>'+esc(x.v)+'</b><div class="tiny muted">'+per(a,b)+((s0.obj1||s0.obj2)?' · '+esc([s0.obj1,s0.obj2].filter(function(o){return o}).join(', ')):'')+'</div></div>'}).join('')+
      ec.map(function(x){return '<div class="pg-sous pg-ech"><b>▲ '+esc(x.v)+'</b><div class="tiny muted">'+(x.fin>x.deb?per(x.deb,x.fin):'semaine du '+fmtDate(parseKey(w[x.deb].lundi)))+'</div></div>'}).join('')+'</div>'}).join('');
  return '<div class="card stack" style="gap:10px"><div class="row between"><h3 style="font-size:16px">Plan général</h3><span class="tiny muted">'+n+' semaines</span></div>'+barre+dates+
    '<button class="btn" data-act="planDetail" data-v="1">Voir toute ma planification en détail</button>'+blocs+'</div>'}
// toute la planification, semaine par semaine : macrocycle, mésocycle et objectifs, type, échéance, charge et séances prévues, UA faites, note du préparateur
function planDetail(w,ci,avant,fini){
  var UA=uaParSemaine(), macs=suites(w,'macro'), n=w.length;
  var corps=macs.map(function(r){
    var nb=r.fin-r.deb+1, sems=w.slice(r.deb,r.fin+1).map(function(s,k){
      var i=r.deb+k, d=parseKey(s.lundi), cur=i===ci, passe=!avant&&(fini||i<ci), debMeso=k===0||w[i-1].meso!==s.meso;
      var infos=[s.charge?'Charge prévue <span class="dots">'+'●'.repeat(Math.min(5,s.charge))+'<span>'+'●'.repeat(Math.max(0,5-s.charge))+'</span></span>':'', s.seances?s.seances+' séance'+(s.seances>1?'s':'')+' prévue'+(s.seances>1?'s':''):'', (passe||cur)?fmtN(UA[s.lundi]||0)+' UA faites':''].filter(function(x){return x});
      return (s.meso&&debMeso?'<div class="pd-meso" style="border-left-color:'+coulMeso(s.meso,s.macro)+'"><b>'+esc(s.meso)+'</b>'+((s.obj1||s.obj2)?'<div class="tiny muted">Objectifs : '+esc([s.obj1,s.obj2].filter(function(o){return o}).join(', '))+'</div>':'')+'</div>':'')+
        '<div class="pd-sem'+(cur?' cur':'')+(passe?' passe':'')+'"'+(cur?' id="pd-auj"':'')+'><div class="row between" style="gap:8px;align-items:center"><div><b>S'+(s.n||i+1)+'</b> <span class="tiny muted">'+fmtDate(d)+' → '+fmtDate(addDays(d,6))+'</span>'+(cur?' <span class="pill s-ok">Cette semaine</span>':'')+'</div>'+(s.type?'<span class="pill mt mt-'+cleType(s.type)+'"'+stType(s.type)+'>'+esc(s.type)+'</span>':'')+'</div>'+
        (s.stage?'<div class="pd-ech">▲ '+esc(s.stage)+'</div>':'')+(infos.length?'<div class="pd-infos tiny">'+infos.join(' · ')+'</div>':'')+(s.note?'<div class="pd-note">'+esc(s.note)+'</div>':'')+'</div>'}).join('');
    return '<div class="card" style="padding:12px 14px"><div class="pd-mac '+(r.v?'mac-'+cleMacro(r.v):'')+'" style="'+(r.v?stMac(r.v):'background:var(--line)')+'"><b>'+esc(r.v||'Sans macrocycle')+'</b><span class="tiny">'+fmtDate(parseKey(w[r.deb].lundi))+' → '+fmtDate(addDays(parseKey(w[r.fin].lundi),6))+' · '+nb+' sem.</span></div>'+sems+'</div>'}).join('');
  return '<div class="wrap stack"><div class="row" style="gap:10px;align-items:center"><button class="btn ghost" style="width:44px;padding:0;border-radius:22px;flex:none" data-act="planDetail" data-v="0" aria-label="Retour">'+I.back+'</button><div><div class="small muted">Du '+fmtDate(parseKey(w[0].lundi))+' au '+fmtDate(addDays(parseKey(w[n-1].lundi),6))+' · '+n+' semaines</div><h1 class="title" style="font-size:24px">Toute ma planification</h1></div></div>'+
    (ci>=0?'<button class="btn ghost" data-act="planAuj" style="align-self:flex-start">Aller à cette semaine</button>':'')+corps+
    '<button class="btn ghost" data-act="planDetail" data-v="0">Retour à ma planification</button></div>'}

// échelle à boutons du formulaire de séance ; retoucher la valeur choisie l'efface (réponse facultative)
// « nom » = le formulaire concerné dans S : form (séance), wform (wellness) ou mform (bilan mensuel)
function echelle(k,lab,aide,min,max,nom){nom=nom||'form'; var f=S[nom]||{}, n=[]; for(var i=min;i<=max;i++)n.push(i);
  return '<div><div class="row between" style="flex-wrap:wrap;gap:4px"><span class="lab" style="margin:0">'+lab+'</span><span class="tiny muted">'+aide+'</span></div>'+
   '<div class="'+(max>5?'grid-rpe':'grid-5')+'" style="margin-top:8px">'+n.map(function(i){return '<button class="num" data-act="eset" data-f="'+nom+'" data-k="'+k+'" data-v="'+i+'" aria-pressed="'+(f[k]===i)+'" aria-label="'+esc(lab)+' '+i+'">'+i+'</button>'}).join('')+'</div></div>'}
// ---------- lot 3 : questions en plus au wellness (seulement celles que le préparateur a activées, toutes facultatives)

function coachData(){

  var parS={}, parW={};                                   // séances et wellness rangés par athlète en un seul passage
  ros.seances.forEach(function(s){(parS[s.athId]=parS[s.athId]||[]).push(s)});
  ros.wellness.forEach(function(w){(parW[w.athId]=parW[w.athId]||[]).push(w)});
  ros.athletes.forEach(function(a){
    var accs=[];
    var se=parS[a.id]||[], we=parW[a.id]||[];
    accs.forEach(function(x){se=se.concat(x.seances); we=we.concat(x.wellness); seen[x.uid]=1});
    rows.push({id:a.id,name:a.prenom,sport:a.sport||'',linked:accs.length>0,se:se,we:we,m:metrics(se,we,ref)});

    if(S.mode==='loading')html='<div class="wrap"><p class="muted">Chargement…</p></div>';
    else if(S.mode==='login')html=loginView();
    else if(S.mode==='error')html='<div class="wrap stack"><h1 class="title">Accès impossible</h1><div class="notice">'+esc(S.error)+'</div></div>';
    else if(S.mode==='coach')html=coachView();
    else html=athleteView();
  }catch(e){
    // jamais d'écran blanc : si un écran échoue, on le dit, et on laisse de quoi revenir en arrière
    html='<div class="wrap stack"><h1 class="title">Cet écran n\'a pas pu s\'afficher</h1><div class="notice">'+esc((e&&e.message)||e)+'</div>'+
      '<p class="small muted" style="margin:0">Tes données ne sont pas perdues. Reviens à l\'accueil, ou envoie ce message à ton préparateur.</p>'+
      '<div class="row" style="gap:8px;flex-wrap:wrap">'+(S.mode==='coach'?'<button class="btn primary" data-act="sel" data-v="">Revenir au tableau</button>':'<button class="btn primary" data-act="tab" data-v="home">Revenir à l\'accueil</button>')+
      '<button class="btn ghost" data-act="logout">Se déconnecter</button></div></div>';
  }
  // les mois / séances que l'athlète a ouverts ou fermés restent comme il les a laissés
  var etats={}; app.querySelectorAll('details[data-id]').forEach(function(d){etats[d.getAttribute('data-id')]=d.open});
  app.innerHTML=html;
  app.querySelectorAll('details[data-id]').forEach(function(d){var k=d.getAttribute('data-id'); if(k in etats)d.open=etats[k]; if(d.open)remplirSeance(d)});
  var fr=app.querySelector('.frise[data-ci]'); if(fr){fr.scrollLeft=Math.max(0,+fr.getAttribute('data-ci')*30-110)}   // frise centrée sur la semaine en cours
  if(focusId){var el=document.getElementById(focusId); if(el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA')&&!el.readOnly){el.focus()}}
}

// ---------- serveur (Google Apps Script)
// appel au script Google : direct (ancien lien, page servie par Google) ou par Internet (app sur GitHub Pages, via doPost)
function call(fn,args){
  if(CHEZ_GOOGLE)return new Promise(function(res,rej){var r=google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(e)}); r[fn].apply(r,args)});
  // 45 s au plus : au-delà, on rend la main avec un message clair plutôt que de laisser l'app figée
  var ctl=window.AbortController?new AbortController():null, minuteur=setTimeout(function(){if(ctl)ctl.abort()},45000), fin=function(){clearTimeout(minuteur)};
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args||[]}),signal:ctl?ctl.signal:undefined})
    .then(function(r){if(!r.ok)throw new Error('Serveur indisponible ('+r.status+'), réessaie.');
        return r.json().catch(function(){throw new Error('Réponse illisible du serveur, réessaie dans un instant.')})},
      function(e){throw new Error(e&&e.name==='AbortError'?'Le serveur met trop de temps à répondre, réessaie.':'Pas de connexion à Internet, ou serveur injoignable. Réessaie.')})
    .then(function(x){fin(); if(!x||!x.ok)throw new Error((x&&x.e)||'Erreur de connexion, réessaie.'); return x.r},function(e){fin(); throw e});
}
function errMsg(e){return (e&&e.message)?String(e.message).replace(/^Exception: /,''):'Erreur de connexion, réessaie.'}
function setAth(d){try{var r=JSON.parse(localStorage.getItem('suivi_data')||'null'); if(r&&r.role!=='coach'&&r.data!==d){r.data=d; garder(r)}}catch(e){} S.profile=d.profile; S.mySeances=d.seances; S.myWellness=d.wellness; S.programme=d.programme||[]; S.outils=d.outils||OUTIL_DEF; S.reglages=d.reglages||{}; S.plus=d.plus||{}; S.invite=!!d.invite; if(S.invite)S.progTab='charge'; S.saison=d.saison||null; S.regleW=d.regleWellness||{limite:11,correction:15}}
function hhmm(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
// état du wellness du jour : ouvert (à remplir), corr (envoyé, correction encore possible), lock (verrouillé), ferme (pas rempli et heure limite passée)
function wEtat(){
  var R=S.regleW||{limite:11,correction:15}, now=new Date(), ex=S.myWellness.filter(function(x){return x.date===key(today())})[0];
  if(ex){ if(ex.saisi&&now.getTime()-ex.saisi<=R.correction*60000) return {st:'corr',ex:ex,fin:new Date(ex.saisi+R.correction*60000),R:R}; return {st:'lock',ex:ex,R:R}; }
  return {st:(now.getHours()+now.getMinutes()/60>=R.limite)?'ferme':'ouvert',R:R};
}
// une mise à jour qui échoue (réseau coupé) ne fait pas disparaître le tableau déjà affiché : on garde l'écran et on prévient
function loadCoach(){return call('getCoachData',[PARAMS.c]).then(function(d){S.roster=d; S.mode='coach'; S.progCoach={}; DERNIERE_SYNC=Date.now(); render(); return true})
  .catch(function(e){if(S.roster&&S.mode==='coach'){render(); toast(errMsg(e)); return false} S.mode='error'; S.error=errMsg(e); render(); return false})}

// ---------- actions
// fermer un mois referme aussi toutes les séances ouvertes dedans (on les retrouve fermées en revenant)
// photo qui ne charge pas : 2e adresse Drive, puis lien de secours (écouteur global : le script est isolé, un onerror="…" ne le verrait pas)
app.addEventListener('error',function(e){var t=e.target; if(t&&t.tagName==='IMG'&&t.classList.contains('ph'))photoErr(t)},true);
app.addEventListener('toggle',function(e){var d=e.target; if(!d||!d.matches)return;
  if(d.matches('details.mois')&&!d.open){d.querySelectorAll('details.prog[open]').forEach(function(x){x.open=false})}
  else if(d.matches('details.prog')&&d.open)remplirSeance(d)},true);
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b)return; var a=b.getAttribute('data-act'), v=b.getAttribute('data-v');
  if(a==='tab'){S.tab=v; S.planDetail=false; window.scrollTo(0,0); render()}
  else if(a==='actu'){var c0=stored('suivi_code'); if(c0&&!S.maj){S.demandeMaj=true; DERNIERE_SYNC=Date.now(); doLogin(c0,true)}}
  else if(a==='planDetail'){S.planDetail=v==='1'; render(); window.scrollTo(0,0)}
  else if(a==='planAuj'){var pa=document.getElementById('pd-auj'); if(pa)pa.scrollIntoView({block:'center',behavior:'smooth'})}
  else if(a==='ftype'){S.form.type=v; render()}
  else if(a==='frpe'){S.form.rpe=+v; render()}
  else if(a==='fset'){var fk=b.getAttribute('data-k'); S.form[fk]=(S.form[fk]===+v?null:+v); render()}
  // échelle ou choix d'un formulaire (séance, wellness, bilan mensuel) : retoucher la valeur choisie l'efface
  else if(a==='eset'||a==='cset'){var fo=S[b.getAttribute('data-f')], ek=b.getAttribute('data-k'), ev=(a==='eset'||b.getAttribute('data-n'))?+v:v; if(fo){fo[ek]=(fo[ek]===ev?null:ev); if(ek==='douleurZone'&&!fo[ek])fo.douleur=null; render()}}
  else if(a==='saveM')saveMensuel();
  else if(a==='progVue'){S.progVue[b.getAttribute('data-a')]=v; render()}
  else if(a==='progPlus'){S.progPlus[v]=(S.progPlus[v]||8)+8; render()}
  else if(a==='progReessai'){delete S.progCoach[v]; render()}
  else if(a==='saveC')saveCompet();
  else if(a==='retourLu'){marquerLu(v); render()}
  else if(a==='retourEdit'){S.retourEdit={athId:b.getAttribute('data-a'),id:v,texte:b.getAttribute('data-t')||''}; render(); var ta=document.getElementById('rt-texte'); if(ta)ta.focus()}
  else if(a==='retourCancel'){S.retourEdit=null; render()}
  else if(a==='retourSave')saveRetour();
  else if(a==='wset'){S.wform[b.getAttribute('data-k')]=+v; render()}
  else if(a==='ptab'){S.progTab=v; render()}
  else if(a==='sel'){S.selected=v||null; render()}
  else if(a==='refresh'){loadCoach().then(function(ok){if(ok)toast('Données actualisées')})}
  else if(a==='saveSeance')saveSeance();
  else if(a==='login'){var v=(document.getElementById('lg-code')||{}).value||''; v=v.trim(); if(!v){toast('Entre ton code.');return} doLogin(v,false)}
  else if(a==='logout'){store('suivi_code',null); try{localStorage.removeItem('suivi_data'); localStorage.removeItem('suivi_copies')}catch(e){}
    PARAMS={}; S.profile=null; S.mySeances=[]; S.myWellness=[]; S.programme=[]; S.roster=null; S.chrono=null; S.tab='home'; S.error=null; S.busy=false; S.mode='login';
    S.plus={}; S.invite=false; S.selected=null; S.retourEdit=null; S.lg=''; S.wform={}; S.mform={}; S.cform={}; S.form={type:'Entraînement club',rpe:6,duree:60,date:null,comment:'',intitule:''};   // rien ne reste de la personne précédente
    window.scrollTo(0,0); render(); toast('Déconnecté')}
  else if(a==='saveW')saveW();
  else if(a==='zoom')zoomPhoto(v);
  else if(a==='theme'){setTheme(v); render()}
  else if(a==='style'){setStyle(v); render()}
  else if(a==='installer'){if(INSTALL.prompt){var pr=INSTALL.prompt; INSTALL.prompt=null; pr.prompt(); pr.userChoice.then(function(){render()}).catch(function(){})}}
  else if(a==='installPlusTard'){store('suivi_install_masque',String(Date.now())); render()}
  else if(a==='outil'){var ok2=b.getAttribute('data-k'), oa=b.getAttribute('data-a'), ot=((S.roster&&S.roster.catalogue)||[]).filter(function(t){return t.id===ok2})[0];
    // donnée de santé : confirmation avant de l'activer (accord écrit des parents pour une mineure)
    if(ot&&ot.sensible&&v!=='off'&&outilDe(oa,ok2)==='off'&&!window.confirm('« '+ot.nom+' » est une donnée de santé.\n\nPour une athlète mineure, il te faut l\'accord écrit de ses parents avant de l\'activer.\n\nActiver cet outil ?'))return;
    var ov={}; ov[ok2]=v; majOutils(oa,ov)}
  else if(a==='param'){if(!b.disabled)majParam(b.getAttribute('data-a'),b.getAttribute('data-k'),+v)}
  else if(a==='outilsBase'){var ob={}; ((S.roster&&S.roster.catalogue)||[]).forEach(function(t){ob[t.id]=''}); majOutils(b.getAttribute('data-a'),ob)}
});
app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='lg-code'){var b=app.querySelector('[data-act="login"]'); if(b)b.click(); return} if(e.key==='Enter'){var tr=e.target.closest('tr[data-act]'); if(tr){tr.click()}}});
app.addEventListener('input',function(e){var t=e.target;
  if(t.id==='f-dur'){S.form.duree=t.value; var L=num(t.value)!=null?num(t.value)*S.form.rpe:null; var c=document.getElementById('f-charge'); if(c)c.textContent=(L!=null?fmtN(L):'–')+' UA'; var fo=document.getElementById('f-form'); if(fo)fo.textContent='RPE '+S.form.rpe+' × '+(t.value||'?')+' min'}
  else if(t.id==='f-date')S.form.date=t.value;
  else if(t.id==='f-com')S.form.comment=t.value;
  else if(t.id==='f-int')S.form.intitule=t.value;
  else if(t.id==='f-vid')S.form.video=t.value;
  else if(t.id==='w-fc')S.wform.fc=t.value===''?null:num(t.value);
  else if(t.id==='w-vfc')S.wform.vfc=t.value===''?null:num(t.value);
  else if(t.id==='m-com')S.mform.comment=t.value;
  else if(t.id==='c-date')S.cform.date=t.value;
  else if(t.id==='c-nom'){var avC=!!String(S.cform.nom||'').trim(); S.cform.nom=t.value; if(avC!==!!t.value.trim()){var bc=app.querySelector('[data-act="saveC"]'); if(bc)bc.disabled=!(S.cform.ressenti!=null&&t.value.trim()&&!S.busy)}}
  else if(t.id==='c-res')S.cform.resultat=t.value;
  else if(t.id==='c-plus')S.cform.plus=t.value;
  else if(t.id==='c-moins')S.cform.moins=t.value;
  else if(t.id==='rt-texte'){if(S.retourEdit)S.retourEdit.texte=t.value}
  else if(t.id==='lg-code')S.lg=t.value;
  else if(t.id==='w-dur')S.wform.duree=t.value===''?null:num(t.value);
});
function saveSeance(){
  var f=S.form, d=num(f.duree); if(d==null||d<=0||d>600){toast('Indique une durée entre 1 et 600 minutes.');return}
  var vid=String(f.video||'').trim(); if(vid&&!/^https:\/\/\S+$/.test(vid)){toast('Le lien vidéo doit commencer par https://');return}
  var doc={date:f.date||key(today()),type:f.type,intitule:f.intitule,duree:d,rpe:f.rpe,comment:f.comment};
  // réponses en plus : envoyées seulement si l'outil est actif (le serveur revérifie)
  if(actif('rpe2')){doc.rpeResp=f.rpeResp==null?'':f.rpeResp; doc.rpeMusc=f.rpeMusc==null?'':f.rpeMusc}
  if(actif('ressenti')){doc.plaisir=f.plaisir==null?'':f.plaisir; doc.technique=f.technique==null?'':f.technique}
  if(actif('video'))doc.video=vid;
  S.busy=true; render();
  call('saveSeance',[PARAMS.a,PARAMS.k,doc])
  .then(function(data){setAth(data); S.busy=false; S.form={type:f.type,rpe:6,duree:60,date:null,comment:'',intitule:''}; S.tab='home'; render(); toast('Séance enregistrée : '+fmtN(d*f.rpe)+' UA')})
  .catch(function(e){S.busy=false; render(); toast(errMsg(e))});
}
function saveW(){
  var f=S.wform, doc={date:key(today()),dureeSommeil:f.duree==null?null:f.duree};
  WITEMS.forEach(function(it){doc[it[0]]=f[it[0]]});
  // questions en plus : envoyées seulement si l'outil est actif (le serveur revérifie)
  var v2=function(x){return x==null?'':x};
  if(actif('prs'))doc.prs=v2(f.prs); if(actif('motivation'))doc.motivation=v2(f.motivation);
  if(actif('douleur')){doc.douleurZone=f.douleurZone||''; doc.douleur=f.douleurZone?v2(f.douleur):''}
  if(actif('fc_repos'))doc.fc=v2(f.fc); if(actif('vfc'))doc.vfc=v2(f.vfc);
  if(actif('cycle')){doc.regles=f.regles||''; doc.symptomes=v2(f.symptomes)}
  S.busy=true; render();
  call('saveWellness',[PARAMS.a,PARAMS.k,doc]).then(function(data){setAth(data); S.busy=false; S.wform={}; S.tab='home'; render(); toast('Wellness enregistré : '+wscore(doc)+'/25')})
  .catch(function(e){S.busy=false; render(); toast(errMsg(e))});
}

// ---------- démarrage
if(CODE_LIEN){doLogin(CODE_LIEN,true)}
else if(PARAMS.c){loadCoach()}
else if(PARAMS.a&&PARAMS.k){call('getAthleteData',[PARAMS.a,PARAMS.k]).then(function(d){setAth(d); S.mode='athlete'; render()}).catch(function(e){S.mode='error'; S.error=errMsg(e); render()})}
else {var sc=stored('suivi_code'); if(sc){doLogin(sc,true)} else {S.mode='login'; render()}}
})();
